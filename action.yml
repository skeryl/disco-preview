name: Disco Preview
description: Deploy a built directory to a Disco server as a per-PR preview, and tear it down when the PR closes.
author: Shane Carroll

branding:
  icon: zap
  color: purple

# GitHub does not enforce `required` on a composite action's inputs, and these
# requirements depend on `mode` anyway, so only the two that every mode needs
# are marked required. The rest say when they apply and are checked at runtime.
inputs:
  mode:
    description: 'deploy, teardown, or sweep.'
    required: false
    default: deploy
  project:
    description: 'Disco project name, e.g. site-pr-42. Needed when mode is deploy or teardown.'
    required: false
  prefix:
    description: 'Project name prefix that marks previews, e.g. site-pr-. Needed when mode is sweep.'
    required: false
  dir:
    description: 'Directory of built files to deploy. Needed when mode is deploy.'
    required: false
  skip-if-superseded:
    description: >-
      Skip the deploy when the PR head has moved past the commit this run
      built. Disco queues deployments by arrival rather than by commit, so a
      slow run landing last would leave the preview behind the PR.
    required: false
    default: 'true'
  clean-urls:
    description: >-
      Give every page a directory index, so /about resolves to about.html the
      way GitHub Pages and Netlify do. Caddy's file_server does not try a
      .html extension on its own.
    required: false
    default: 'true'
  exclude:
    description: >-
      Newline-separated .dockerignore patterns for files to keep out of the
      upload. Excluded files 404 in the preview, so leave out only what you do
      not need to review.
    required: false
  public-path:
    description: >-
      Name of the subdirectory the build is staged in inside the upload, which
      is also the publicPath written into the generated disco.json. It is an
      internal staging detail and never appears in a URL, so the default suits
      almost everyone. It cannot be '.', because the daemon refuses to serve
      the upload root. Ignored when dir already contains a disco.json.
    required: false
    default: public
  disco-host:
    description: 'Disco server host, e.g. disco.example.com'
    required: true
  disco-api-key:
    description: 'Disco API key. Pass from secrets.'
    required: true
  disco-name:
    description: 'Name for this server in the generated CLI config.'
    required: false
    default: ci
  comment:
    description: 'Post or update a PR comment with the preview URL (deploy mode).'
    required: false
    default: 'true'
  github-token:
    description: 'Token used to comment on the PR and, in sweep mode, to check PR state.'
    required: false
    default: ${{ github.token }}

outputs:
  url:
    description: 'The preview URL, e.g. https://site-pr-42.disco.example.com'
    value: ${{ steps.deploy.outputs.url }}
  project:
    description: 'The Disco project that was deployed.'
    value: ${{ steps.deploy.outputs.project }}

runs:
  using: composite
  steps:
    - name: Install the Disco CLI
      shell: bash
      run: |
        set -euo pipefail
        if command -v disco >/dev/null 2>&1; then
          echo "disco already on PATH"
          exit 0
        fi
        # Not on npm: the "disco" npm package is an unrelated DOM library.
        curl -fsSL https://cli-assets.letsdisco.dev/install.sh | sh
        # The installer does not always land somewhere later steps can see.
        if ! command -v disco >/dev/null 2>&1; then
          for d in /usr/local/bin "$HOME/.local/bin" "$HOME/bin" /opt/disco/bin; do
            if [ -x "$d/disco" ]; then
              echo "$d" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::disco CLI installed but could not be found on PATH" >&2
          exit 1
        fi

    - name: Write the CLI config
      shell: bash
      env:
        DISCO_HOST: ${{ inputs.disco-host }}
        DISCO_API_KEY: ${{ inputs.disco-api-key }}
        DISCO_NAME: ${{ inputs.disco-name }}
      run: |
        set -euo pipefail
        echo "::add-mask::$DISCO_API_KEY"
        # A composite action's `required: true` does not reject an empty
        # string, so an unset secret arrives as "" and the CLI fails much
        # later with something unrelated-looking about DNS.
        missing=""
        [ -n "$DISCO_HOST" ] || missing="disco-host"
        [ -n "$DISCO_API_KEY" ] || missing="${missing:+$missing and }disco-api-key"
        if [ -n "$missing" ]; then
          echo "::error::$missing is empty. Check the secret names, and note that secrets are not available to pull_request runs from forks." >&2
          exit 1
        fi
        [ -n "${RUNNER_TEMP:-}" ] || { echo "::error::RUNNER_TEMP is not set" >&2; exit 1; }
        cfg="${RUNNER_TEMP}/disco-config.json"
        jq -n --arg n "$DISCO_NAME" --arg h "$DISCO_HOST" --arg k "$DISCO_API_KEY" \
          '{discos: {($n): {name: $n, host: $h, apiKey: $k}}}' > "$cfg"
        chmod 600 "$cfg"
        # src/config.ts honours DISCO_CONFIG_PATH specifically for CI.
        echo "DISCO_CONFIG_PATH=$cfg" >> "$GITHUB_ENV"

    - name: Deploy
      id: deploy
      if: inputs.mode == 'deploy'
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        DIR: ${{ inputs.dir }}
        EXCLUDE: ${{ inputs.exclude }}
        PUBLIC_PATH: ${{ inputs.public-path }}
        CLEAN_URLS: ${{ inputs.clean-urls }}
        SKIP_SUPERSEDED: ${{ inputs.skip-if-superseded }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        [ -n "$PROJECT" ] || { echo "::error::'project' is required when mode is deploy" >&2; exit 1; }
        [ -n "$DIR" ] || { echo "::error::'dir' is required when mode is deploy" >&2; exit 1; }
        [ -d "$DIR" ] || { echo "::error::dir '$DIR' does not exist" >&2; exit 1; }
        [ -n "${RUNNER_TEMP:-}" ] || { echo "::error::RUNNER_TEMP is not set" >&2; exit 1; }

        # Disco numbers deployments on arrival and the queue runs in that
        # order, so whichever run calls `disco deploy` last wins no matter
        # which commit it carries. Two pushes close together can finish out of
        # order and leave the preview showing the older one. If the head has
        # already moved past what this run built, the newer run is the one
        # that should publish.
        #
        # Unlike the sweep, an unanswerable check here means carry on: the
        # cost of being wrong is a stale preview that the next push corrects,
        # not a deletion that cannot be undone.
        if [ "${SKIP_SUPERSEDED:-true}" = "true" ] && [ -n "${PR:-}" ] && [ -n "${SHA:-}" ]; then
          if head="$(gh pr view "$PR" --json headRefOid --jq .headRefOid 2>/dev/null)" \
            && [ -n "$head" ] && [ "$head" != "$SHA" ]; then
            echo "::warning::PR head is now ${head:0:7} but this run built ${SHA:0:7}; skipping so the newer run publishes"
            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        # projects:add fails when the project exists, and it will on every
        # push after the first, so look before creating. A failed list has to
        # be told apart from an empty one, or an unreachable server reads as
        # "not there" and we try to create what may already exist.
        if ! listing="$(disco projects:list --json 2>&1)" || ! printf '%s' "$listing" | jq -e . >/dev/null 2>&1; then
          echo "::error::could not list projects: $listing" >&2
          exit 1
        fi
        if printf '%s' "$listing" | jq -e --arg p "$PROJECT" '.projects[]? | select(.name == $p)' >/dev/null; then
          echo "project $PROJECT already exists"
        else
          echo "creating project $PROJECT"
          # No --github: a project deployed from files rather than a repo.
          # No --domain: it inherits NAME.<server host>, which needs the
          # server host to have a wildcard DNS record.
          if ! add_out="$(disco projects:add --name "$PROJECT" 2>&1)"; then
            # Two pushes in quick succession each check, then each create.
            # Only one can win, and the loser has nothing to do: creating a
            # project deploys nothing, so both runs carry on from here.
            if disco projects:list --json 2>/dev/null \
              | jq -e --arg p "$PROJECT" '.projects[]? | select(.name == $p)' >/dev/null; then
              echo "project $PROJECT appeared concurrently; carrying on"
            else
              echo "::error::could not create project $PROJECT: $add_out" >&2
              exit 1
            fi
          fi
        fi

        # Everything is staged under RUNNER_TEMP. The caller's build directory
        # is never written to: a self-hosted runner reuses its workspace, so
        # appending to a .dockerignore there would compound on every run.
        upload="${RUNNER_TEMP}/disco-preview-upload"
        rm -rf "$upload"
        mkdir -p "$upload"

        if [ -f "$DIR/disco.json" ]; then
          # The caller laid this out themselves. Copy it as it is and take
          # publicPath from their file rather than guessing at it.
          cp -al "$DIR/." "$upload/" 2>/dev/null || cp -a "$DIR/." "$upload/"
          site_root="$upload/$(jq -r '.services.web.publicPath // "dist"' "$upload/disco.json")"
          echo "using the disco.json from $DIR"
        else
          # The build goes in a subdirectory, with disco.json above it.
          #
          # `deploy --dir` uploads a directory that has to carry a disco.json
          # at its top level, and that file's publicPath names the directory
          # inside the upload holding the site. Those cannot be the same
          # directory. Naming the upload root, by writing publicPath ".",
          # is rejected: the daemon resolves publicPath and then requires the
          # result to start with "<project>/", but the root resolves to
          # exactly "<project>" with no trailing slash, so it trips a guard
          # written to stop "../.." from escaping the project folder.
          #
          # So: upload/disco.json says publicPath is "public", and the build
          # lands in upload/public/. The name is this action's own and never
          # appears in a URL.
          case "$PUBLIC_PATH" in
            ''|'.'|'./'|/*|*..*)
              echo "::error::public-path cannot be '$PUBLIC_PATH'; the daemon rejects the upload root and paths outside it. Use a subdirectory name." >&2
              exit 1 ;;
          esac
          mkdir -p "$(dirname "$upload/$PUBLIC_PATH")"
          # Hardlinks, so a large build is not copied twice on the runner.
          cp -al "$DIR" "$upload/$PUBLIC_PATH" 2>/dev/null \
            || cp -a "$DIR" "$upload/$PUBLIC_PATH"
          jq -n --arg p "$PUBLIC_PATH" \
            '{version: "1.0", services: {web: {type: "static", publicPath: $p}}}' \
            > "$upload/disco.json"
          site_root="$upload/$PUBLIC_PATH"
          echo "staged $DIR at $PUBLIC_PATH/ with a generated disco.json"
        fi

        # Caddy's file_server serves what is on disk and nothing more: it does
        # not try a .html extension the way GitHub Pages and Netlify do, so
        # /about 404s next to an about.html. Give each page a directory index.
        if [ "${CLEAN_URLS:-true}" = "true" ]; then
          if [ ! -d "$site_root" ]; then
            echo "::warning::publicPath does not resolve to a directory; skipping clean urls"
          else
            linked=0
            while IFS= read -r -d '' f; do
              d="${f%.html}"
              # journal.html can sit beside a real journal/ directory; the
              # index belongs inside it either way.
              if [ -e "$d/index.html" ]; then continue; fi
              mkdir -p "$d"
              ln "$f" "$d/index.html" 2>/dev/null || cp "$f" "$d/index.html"
              linked=$((linked + 1))
            done < <(find "$site_root" -type f -name '*.html' ! -name 'index.html' -print0)
            echo "clean urls: added $linked directory index(es)"
          fi
        fi

        # The CLI applies the upload directory's own .dockerignore, so
        # excluding here costs nothing: the files are never read or sent.
        patterns="$(printf '%s\n' "$EXCLUDE" | sed '/^[[:space:]]*$/d')"
        if [ -n "$patterns" ]; then
          # .dockerignore matches from the root of the directory, so a bare
          # *.mp4 silently matches nothing nested and the upload stays large.
          while IFS= read -r pat; do
            case "$pat" in
              '*.'*) echo "::warning::exclude pattern '$pat' only matches files at the root of the upload; use '**/$pat' to match nested files too" ;;
            esac
          done <<< "$patterns"
          { echo ""; echo "# added by disco-preview"; printf '%s\n' "$patterns"; } >> "$upload/.dockerignore"
          echo "excluding:"
          printf '%s\n' "$patterns" | sed 's/^/  /'
        fi

        # Remember where the numbering was, so the status check below cannot
        # read an older deployment and call it this one's result.
        before="$(disco deploy:list --project "$PROJECT" --json \
          | jq -r '[.deployments[].number] | max // 0')"

        disco deploy --project "$PROJECT" --dir "$upload"

        # `disco deploy` streams the server's output and exits 0 whatever it
        # says, so a deployment that failed and rolled back still looks like
        # a success. Read the status back instead.
        status=""; number=""
        for _ in $(seq 1 30); do
          latest="$(disco deploy:list --project "$PROJECT" --json \
            | jq -c --argjson b "$before" \
              '[.deployments[] | select(.number > $b)] | sort_by(.number) | last // empty')"
          if [ -n "$latest" ]; then
            number="$(printf '%s' "$latest" | jq -r .number)"
            status="$(printf '%s' "$latest" | jq -r .status)"
            case "$status" in COMPLETE|FAILED|CANCELLED) break ;; esac
          fi
          sleep 2
        done
        if [ -z "$number" ]; then
          echo "::error::no deployment newer than #$before was created" >&2
          exit 1
        fi
        if [ "$status" != "COMPLETE" ]; then
          echo "::error::deployment #$number ended as ${status:-unknown}" >&2
          disco deploy:output --project "$PROJECT" 2>&1 | tail -30 || true
          exit 1
        fi
        echo "deployment #$number is COMPLETE"

        domain="$(disco domains:list --project "$PROJECT" --json | jq -r '.domains[0].name // empty')"
        echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
        if [ -z "$domain" ]; then
          echo "::warning::project $PROJECT has no domain; does the server host have a wildcard DNS record?"
          exit 0
        fi
        echo "url=https://$domain" >> "$GITHUB_OUTPUT"
        echo "deployed to https://$domain"

    - name: Comment on the PR
      if: inputs.mode == 'deploy' && inputs.comment == 'true' && github.event.pull_request.number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        # A preview job has no reason to check out the repo, so gh cannot
        # infer it from a .git directory that is not there.
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        # GITHUB_SHA on a pull_request event is the merge commit, which is not
        # a commit anyone can find in the PR. Name the head instead.
        SHA: ${{ github.event.pull_request.head.sha }}
        URL: ${{ steps.deploy.outputs.url }}
        PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail
        [ -n "$URL" ] || exit 0
        # head.sha is empty outside a pull_request event, and bash 5 under
        # `set -u` aborts on a substring of an unset variable where bash 3.2
        # quietly yields "", so default it before slicing.
        sha="${SHA:-${GITHUB_SHA:-}}"
        from="${sha:+ from \`${sha:0:7}\`}"
        body="$(printf '%s\n' \
          "<!-- disco-preview:$PROJECT -->" \
          "Preview: $URL" \
          "" \
          "Deployed${from}. Torn down when this PR closes.")"
        # --edit-last keeps one comment instead of one per push, and fails
        # when there is nothing to edit yet.
        gh pr comment "$PR" --body "$body" --edit-last 2>/dev/null \
          || gh pr comment "$PR" --body "$body"

    - name: Teardown
      if: inputs.mode == 'teardown'
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail
        [ -n "$PROJECT" ] || { echo "::error::'project' is required when mode is teardown" >&2; exit 1; }
        # Without this, an unreachable server looks exactly like a project
        # that is already gone, and teardown reports success having done
        # nothing. That is the failure this job exists to prevent.
        if ! listing="$(disco projects:list --json 2>&1)" || ! printf '%s' "$listing" | jq -e . >/dev/null 2>&1; then
          echo "::error::could not list projects: $listing" >&2
          exit 1
        fi
        if ! printf '%s' "$listing" | jq -e --arg p "$PROJECT" '.projects[]? | select(.name == $p)' >/dev/null; then
          echo "project $PROJECT is already gone"
          exit 0
        fi
        # --no-input or the CLI waits on a confirm prompt that never comes.
        disco projects:remove "$PROJECT" --no-input
        # projects:remove downgrades API failures to a warning and exits 0,
        # so confirm by listing rather than trusting the exit code.
        if ! listing="$(disco projects:list --json 2>&1)" || ! printf '%s' "$listing" | jq -e . >/dev/null 2>&1; then
          echo "::error::could not confirm removal: $listing" >&2
          exit 1
        fi
        if printf '%s' "$listing" | jq -e --arg p "$PROJECT" '.projects[]? | select(.name == $p)' >/dev/null; then
          echo "::error::project $PROJECT still exists after removal" >&2
          exit 1
        fi
        echo "removed $PROJECT"

    - name: Sweep
      if: inputs.mode == 'sweep'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PREFIX: ${{ inputs.prefix }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        [ -n "$PREFIX" ] || { echo "::error::'prefix' is required when mode is sweep" >&2; exit 1; }

        if ! listing="$(disco projects:list --json 2>&1)" || ! printf '%s' "$listing" | jq -e . >/dev/null 2>&1; then
          echo "::error::could not list projects: $listing" >&2
          exit 1
        fi
        projects="$(printf '%s' "$listing" \
          | jq -r --arg pre "$PREFIX" '.projects[]? | select(.name | startswith($pre)) | .name')"
        [ -n "$projects" ] || { echo "no projects match $PREFIX"; exit 0; }

        removed=0; kept=0; skipped=0; removed_names=""
        while IFS= read -r project; do
          [ -n "$project" ] || continue
          number="${project#"$PREFIX"}"
          # Only reap names that end in a PR number; anything else was not
          # ours to delete.
          case "$number" in
            ''|*[!0-9]*) echo "skipping $project (no trailing PR number)"; skipped=$((skipped + 1)); continue ;;
          esac
          # Ask about this PR specifically rather than diffing against a list
          # of open ones. A list that comes back empty because the API
          # hiccuped is indistinguishable from every PR being closed, and this
          # job deletes things unattended. Delete only on a definite answer.
          if ! state="$(gh pr view "$number" --repo "$REPO" --json state --jq .state 2>&1)"; then
            # Includes the case where the PR does not exist at all, which a
            # prefix shared across repositories would produce. Telling that
            # apart from an outage means matching on error text, and getting
            # it wrong deletes something; a project left behind is a nuisance
            # a human can clear up.
            echo "::warning::could not check PR #$number ($state); leaving $project alone. If this repeats, remove it by hand."
            skipped=$((skipped + 1)); continue
          fi
          case "$state" in
            OPEN) kept=$((kept + 1)); continue ;;
            CLOSED|MERGED) ;;
            *) echo "::warning::unexpected state '$state' for PR #$number; leaving $project alone"
               skipped=$((skipped + 1)); continue ;;
          esac
          echo "PR #$number is $state; removing $project"
          disco projects:remove "$project" --no-input
          removed_names="${removed_names}${project}"$'\n'
          removed=$((removed + 1))
        done <<< "$projects"

        # projects:remove warns and exits 0 when the API call fails, same as
        # in teardown, so confirm what actually went.
        if [ -n "$removed_names" ]; then
          if ! listing="$(disco projects:list --json 2>&1)" || ! printf '%s' "$listing" | jq -e . >/dev/null 2>&1; then
            echo "::error::could not confirm removals: $listing" >&2
            exit 1
          fi
          still=""
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if printf '%s' "$listing" | jq -e --arg p "$p" '.projects[]? | select(.name == $p)' >/dev/null; then
              still="${still}$p "
            fi
          done <<< "$removed_names"
          if [ -n "$still" ]; then
            echo "::error::still present after removal: $still" >&2
            exit 1
          fi
        fi
        echo "swept $removed, kept $kept, skipped $skipped"
